site_name: HeapTrail user guide
site_description: Find what is holding your memory. Learn to capture, analyse and compare JVM and Android heap dumps with HeapTrail, the fast command-line analyzer.
site_url: https://heaptrail.neerdael.nl/
repo_url: https://github.com/johnneerdael/heaptrail
repo_name: johnneerdael/heaptrail
edit_uri: edit/master/docs/user-guide/
docs_dir: docs/user-guide
site_dir: build/user-guide-site
copyright: HeapTrail is free, open-source software (Apache-2.0). It began as a fork of hprof-slurp and is not affiliated with Eclipse MAT, VisualVM, LeakCanary or Android Studio.

# Writer-only material lives beside the pages but is not published.
exclude_docs: |
  _meta/
  _snippets/

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/brand/heaptrail-mark-on-dark.svg
  favicon: assets/brand/favicon.svg
  # Fonts are self-hosted from assets/fonts (see stylesheets/heaptrail.css).
  font: false
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system setting
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - stylesheets/heaptrail.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/johnneerdael/heaptrail
      name: HeapTrail on GitHub
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/heaptrail
      name: HeapTrail on crates.io

plugins:
  - search:
      # Keep Material's punctuation/CamelCase/version boundaries; add $ and %.
      separator: '[\s\-$%,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: docs/user-guide/_snippets
      auto_append:
        - abbreviations.md
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        # The 16 supporting glyphs from the brand kit, as :heaptrail-trace: and so on.
        custom_icons:
          - docs/overrides/.icons

# Strict builds (`mkdocs build --strict`) turn every one of these into an error.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

